services:
  postgres:
    image: postgres:16
    container_name: nexus_pg
    restart: always
    ports:
      - '5440:5432'
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: Gaurav_nexus
      POSTGRES_PASSWORD: Ecxu8hmd
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: always
    ports:
      - '6381:6379'

volumes:
  pg_data:
