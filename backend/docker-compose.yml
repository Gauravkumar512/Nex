services:
  postgres:
    image: postgres:16
    container_name: nex_pg
    restart: always
    ports:
      - '5440:5432'
    environment:
      POSTGRES_DB: nex
      POSTGRES_USER: nex_admin
      POSTGRES_PASSWORD: nex_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nex_admin -d nex']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nex_redis
    restart: always
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: development
    container_name: nex_app
    restart: unless-stopped
    command: npm run dev
    env_file: .env
    environment:
      NODE_ENV: development
      # Override .env values so services address each other by compose service name
      DATABASE_URL: postgresql://nex_admin:nex_password@postgres:5432/nex
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      # Isolate container's node_modules from the host to avoid platform conflicts
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: development
    container_name: nex_worker
    restart: unless-stopped
    command: npm run worker
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://nex_admin:nex_password@postgres:5432/nex
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  node_modules:
